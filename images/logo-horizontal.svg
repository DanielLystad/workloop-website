<svg viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6FCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D8F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Infinity Loop Icon -->
  <g id="infinity-icon">
    <!-- Left circle -->
    <circle cx="20" cy="30" r="14" fill="none" stroke="url(#logo-gradient)" stroke-width="5"/>

    <!-- Right circle -->
    <circle cx="40" cy="30" r="14" fill="none" stroke="url(#logo-gradient)" stroke-width="5"/>

    <!-- Connection center -->
    <circle cx="30" cy="30" r="6" fill="#FBD85D"/>

    <!-- Flow arrows -->
    <path d="M 34 22 L 38 20 L 36 24" fill="url(#logo-gradient)"/>
    <path d="M 26 38 L 22 40 L 24 36" fill="url(#logo-gradient)"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark" transform="translate(70, 0)">
    <!-- Work -->
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#002D6E" letter-spacing="-0.5">Work</text>

    <!-- Loop -->
    <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1A6FCC" letter-spacing="-0.5">Loop</text>
  </g>
</svg>
