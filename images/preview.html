<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkLoop Logo - Final</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 3rem;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #002D6E; text-align: center; }
    .subtitle { color: #666; margin-bottom: 3rem; text-align: center; }
    .container { max-width: 1200px; margin: 0 auto; }
    .logo-section {
      background: white;
      border-radius: 16px;
      padding: 3rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .logo-section h2 { color: #002D6E; margin-bottom: 1.5rem; }
    .logo-display {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-radius: 12px;
      background: #f9fafb;
      margin: 1rem 0;
    }
    .dark-bg { background: #1a1a1a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WorkLoop Logo System ✨</h1>
    <p class="subtitle">Infinity Loop Design - Final Version</p>

    <div class="logo-section">
      <h2>Primary Horizontal Logo</h2>
      <div class="logo-display">
        <img src="logo-horizontal.svg" alt="WorkLoop" style="width: 260px;">
      </div>
    </div>

    <div class="grid">
      <div class="logo-section">
        <h2>Vertical Logo</h2>
        <div class="logo-display">
          <img src="logo-vertical.svg" alt="WorkLoop Vertical" style="height: 160px;">
        </div>
      </div>

      <div class="logo-section">
        <h2>Icon Only</h2>
        <div class="logo-display">
          <img src="logo-icon.svg" alt="WorkLoop Icon" style="width: 80px;">
        </div>
      </div>
    </div>

    <div class="logo-section">
      <h2>Usage Examples</h2>
      <div class="grid">
        <div>
          <p style="margin-bottom: 1rem; color: #666;">Light background:</p>
          <div class="logo-display" style="background: white;">
            <img src="logo-horizontal.svg" alt="WorkLoop" style="width: 220px;">
          </div>
        </div>
        <div>
          <p style="margin-bottom: 1rem; color: #666;">Dark background:</p>
          <div class="logo-display dark-bg">
            <img src="logo-horizontal.svg" alt="WorkLoop" style="width: 220px; filter: brightness(0) invert(1);">
          </div>
        </div>
      </div>
    </div>

    <div class="logo-section" style="text-align: center;">
      <h2 style="margin-bottom: 2rem;">Files Ready to Use</h2>
      <div style="display: inline-block; text-align: left; background: #f0f4f8; padding: 1.5rem 2rem; border-radius: 8px;">
        <p style="font-family: monospace; margin: 0.5rem 0;">✅ logo-horizontal.svg</p>
        <p style="font-family: monospace; margin: 0.5rem 0;">✅ logo-vertical.svg</p>
        <p style="font-family: monospace; margin: 0.5rem 0;">✅ logo-icon.svg</p>
        <p style="font-family: monospace; margin: 0.5rem 0;">✅ favicon.svg</p>
      </div>
    </div>
  </div>
</body>
</html>
