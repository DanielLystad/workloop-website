<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vert-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6FCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D8F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Infinity Loop Icon centered at top -->
  <g id="infinity-icon" transform="translate(70, 40)">
    <!-- Left circle -->
    <circle cx="-20" cy="0" r="18" fill="none" stroke="url(#vert-gradient)" stroke-width="6"/>

    <!-- Right circle -->
    <circle cx="20" cy="0" r="18" fill="none" stroke="url(#vert-gradient)" stroke-width="6"/>

    <!-- Connection center -->
    <circle cx="0" cy="0" r="8" fill="#FBD85D"/>

    <!-- Flow arrows -->
    <path d="M 6 -10 L 12 -13 L 10 -7" fill="url(#vert-gradient)"/>
    <path d="M -6 10 L -12 13 L -10 7" fill="url(#vert-gradient)"/>
  </g>

  <!-- Wordmark stacked below -->
  <g id="wordmark-stacked">
    <!-- Work -->
    <text x="70" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#002D6E" letter-spacing="-0.5">Work</text>

    <!-- Loop -->
    <text x="70" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1A6FCC" letter-spacing="-0.5">Loop</text>
  </g>
</svg>
