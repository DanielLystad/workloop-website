<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6FCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D8F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circular infinity/loop symbol -->
  <g id="infinity-loop">
    <!-- Left circle -->
    <circle cx="20" cy="30" r="14" fill="none" stroke="url(#icon-gradient)" stroke-width="5"/>

    <!-- Right circle -->
    <circle cx="40" cy="30" r="14" fill="none" stroke="url(#icon-gradient)" stroke-width="5"/>

    <!-- Connection intersection (creates infinity symbol) -->
    <circle cx="30" cy="30" r="6" fill="#FBD85D"/>

    <!-- Flow arrows -->
    <path d="M 34 22 L 38 20 L 36 24" fill="url(#icon-gradient)"/>
    <path d="M 26 38 L 22 40 L 24 36" fill="url(#icon-gradient)"/>
  </g>
</svg>
