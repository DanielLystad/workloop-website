<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6FCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D8F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Simplified infinity loop for favicon size -->
  <g id="infinity-fav">
    <!-- Left circle -->
    <circle cx="11" cy="16" r="8" fill="none" stroke="url(#fav-gradient)" stroke-width="3"/>

    <!-- Right circle -->
    <circle cx="21" cy="16" r="8" fill="none" stroke="url(#fav-gradient)" stroke-width="3"/>

    <!-- Connection center -->
    <circle cx="16" cy="16" r="4" fill="#FBD85D"/>

    <!-- Flow arrow indicators -->
    <path d="M 18 11 L 20 10 L 19 12" fill="url(#fav-gradient)"/>
    <path d="M 14 21 L 12 22 L 13 20" fill="url(#fav-gradient)"/>
  </g>
</svg>
